# File-level build property overrides for epscmort.cbl
#
# epscmort.cbl uses embedded SQL (EXEC SQL / EXEC SQL INCLUDE SQLCA).
# isCICS=true  — triggers the CICS translator before compile
# isSQL=true   — triggers the DB2 precompiler (DSNHPC) before compile
#                and causes the compile parm to include SQL

isCICS=true
isSQL=true
